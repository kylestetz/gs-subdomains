# nginx config for the album sites. Assumes the repo is checked out at
# /var/www/gs-subdomains and the app runs on port 3000 with
# ACCEL_REDIRECT=/_downloads/. Install it with a symlink so it updates on pull:
#
#   sudo ln -s /var/www/gs-subdomains/deploy/nginx.conf /etc/nginx/sites-enabled/gs-subdomains.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx serves the sites as static files. Only code requests go to Node, and Node
# hands each ZIP back to nginx to send (X-Accel-Redirect).

server {
	listen 80;

	# Every album in albums.js (test/app.test.js checks this list).
	server_name ~^(?<album>cola|fossilillies|maranasati|mirage|pare|safeword|slagroom|theacchinbook|troubleshooting)\.grindselect\.com$;

	root /var/www/gs-subdomains/sites/$album/public;

	location /shared/ {
		root /var/www/gs-subdomains/sites;
	}

	# Code redemption and downloads go to Node. `/download/.` needs at least one
	# character after the slash, so slagroom's /download/ code page stays static.
	location ~ ^/(api/|download/.) {
		client_max_body_size 1k;
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Where the X-Accel-Redirect from Node points. `internal` means it can't be
	# requested directly. Must match DOWNLOADS_DIR.
	location /_downloads/ {
		internal;
		alias /var/www/gs-subdomains/downloads/;
		# Never answer a download with 304 Not Modified; browsers stall on it.
		etag off;
		if_modified_since off;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
